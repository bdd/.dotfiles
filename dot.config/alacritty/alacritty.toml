[font]
normal = { family = "Monaspace Xenon" }
italic = { family = "Monaspace Radon" }

[cursor]
style = { shape = "Block", blinking = "Off" }

[window]
padding = { x = 2, y = 5 }
dynamic_padding = true

[mouse]
hide_when_typing = true

# Ayu Dark (Ghostty theme = Ayu).
[colors.primary]
background = '#0A0E14'
foreground = '#B3B1AD'

[colors.normal]
black   = '#01060E'
red     = '#EA6C73'
green   = '#91B362'
yellow  = '#F9AF4F'
blue    = '#53BDFA'
magenta = '#FAE994'
cyan    = '#90E1C6'
white   = '#C7C7C7'

[colors.bright]
black   = '#686868'
red     = '#F07178'
green   = '#C2D94C'
yellow  = '#FFB454'
blue    = '#59C2FF'
magenta = '#FFEE99'
cyan    = '#95E6CB'
white   = '#FFFFFF'
